<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BЯEAKOUT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    body {
      background: #0b0f1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, monospace;
      overflow: hidden;
    }
    .game-wrapper {
      background: #131a2c;
      padding: 1rem;
      border-radius: 2rem;
      box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #2e3b5e;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 800px;
      max-height: 70vh;
      aspect-ratio: 800 / 500;
      border-radius: 1.5rem;
      background: #0e1424;
      box-shadow: inset 0 0 40px #00000055, 0 8px 0 #05080f;
      touch-action: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b9c8ff;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 3px black;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .score, .lives, .level {
      background: #1d2742;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      box-shadow: inset 0 3px 6px #00000060, 0 4px 0 #0b0f1a;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .score span, .lives span, .level span {
      color: #f7f0b9;
      font-size: 1.2rem;
      font-weight: 800;
      min-width: 1.8rem;
      text-align: center;
      text-shadow: 0 0 12px #ffd966;
    }
    .restart-btn {
      background: #2a3759;
      border: none;
      color: #dee9ff;
      font-weight: bold;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      box-shadow: 0 5px 0 #0e121f, 0 6px 8px black;
      cursor: pointer;
      transition: 0.08s ease;
      text-transform: uppercase;
    }
    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0e121f, 0 4px 8px black;
    }
    .hint {
      color: #7b8bc0;
      font-size: 0.8rem;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="status-bar">
    <div class="score">🎯 <span id="scoreDisplay">0</span></div>
    <div class="lives">❤️ <span id="livesDisplay">3</span></div>
    <div class="level">📁 <span id="levelDisplay">1</span></div>
    <button class="restart-btn" id="restartButton">↻</button>
  </div>
  <div class="hint">drag to move · tap to launch · ⌨️ ← → / space · R restart</div>
</div>

<script>
  (function() {
    // ---------- CANVAS ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const livesSpan = document.getElementById('livesDisplay');
    const levelSpan = document.getElementById('levelDisplay');

    // ---------- DIMENSIONS ----------
    const CW = 800;
    const CH = 500;

    const PADDLE_WIDTH = 120;
    const PADDLE_HEIGHT = 16;
    const PADDLE_Y = CH - 40;
    const PADDLE_SPEED = 8;

    const BALL_RADIUS = 8;
    const BALL_SPEED = 5.5;

    const BRICK_COLS = 10;
    const BRICK_ROWS = 8;
    const BRICK_WIDTH = 68;
    const BRICK_HEIGHT = 22;
    const BRICK_PADDING = 6;
    const BRICK_OFFSET_X = (CW - (BRICK_COLS * (BRICK_WIDTH + BRICK_PADDING) - BRICK_PADDING)) / 2;
    const BRICK_OFFSET_Y = 50;

    // ---------- POWER-UP CONFIG ----------
    const POWERUP_CHANCE = 0.18;         // 18% of destroyed bricks drop something
    const POWERUP_FALL_SPEED = 2.4;
    const POWERUP_SIZE = 26;
    const POWERUP_DURATION = 480;        // frames (~8s at 60fps) for timed effects
    const MULTIBALL_SPEED = BALL_SPEED;  // speed of spawned extra balls
    const PADDLE_WIDE_EXTRA = 70;
    const PADDLE_NARROW_LOSS = 50;

    // Power-up types (color, letter, name)
    const POWERUP_TYPES = [
      { id: 'expand',  color: '#4ade80', letter: 'E', label: 'WIDE'     },
      { id: 'shrink',  color: '#f87171', letter: 'S', label: 'NARROW'   },
      { id: 'multi',   color: '#60a5fa', letter: 'M', label: 'MULTI'    },
      { id: 'slow',    color: '#a78bfa', letter: '⏱', label: 'SLOW'     },
      { id: 'extra',   color: '#fbbf24', letter: '❤', label: 'EXTRA LIFE' },
      { id: 'sticky',  color: '#f472b6', letter: '⊂', label: 'STICKY'   }
    ];

    // ---------- LEVELS ----------
    const LEVELS = [
      ["##########","##########","##########","##########","##########"],
      ["....##....","...####...","..######..",".########.","##########"],
      ["#.#.#.#.#.",".#.#.#.#.#","#.#.#.#.#.",".#.#.#.#.#","#.#.#.#.#."],
      ["....##....","...####...","..######..",".########.","##########",".########.","..######..","...####..."],
      ["###....###","###....###","###....###","##########","###....###","###....###","###....###"],
      ["....##....","...####...","..######..",".########.","##########","....##....","....##....","....##...."],
      [".###..###.","##########","##########","##########",".########.","..######..","...####...","....##...."],
      ["##........",".###......","..#####...","...#######","....######","...#######","..#####...",".###......"],
      ["#.#.#.#.#.","#.#.#.#.#.","#.#.#.#.#.","#.#.#.#.#.","#.#.#.#.#.",".#.#.#.#.#","..#.#.#.#."],
      ["##########","#........#","#........#","#........#","#........#","#........#","#........#","##########"]
    ];

    // ---------- GAME STATE ----------
    let leftPressed = false;
    let rightPressed = false;

    let paddleX = (CW - PADDLE_WIDTH) / 2;
    let paddleWidth = PADDLE_WIDTH;       // current width (can change via power-ups)

    let ballX = CW / 2;
    let ballY = PADDLE_Y - BALL_RADIUS - 1;
    let ballDX = 0;
    let ballDY = 0;
    let ballActive = false;

    // Extra balls (multiball). Each: {x, y, dx, dy}
    let extraBalls = [];

    let bricks = [];
    let score = 0;
    let lives = 3;
    let levelIndex = 0;
    let gameOver = false;
    let gameWin = false;
    let levelCleared = false;

    // Active power-up timers
    let activePowerUps = {
      expand: 0,     // frames remaining
      shrink: 0,
      slow: 0,
      sticky: 0
    };

    // Falling power-up capsules
    let powerUps = [];

    // Particles (visual feedback)
    let particles = [];

    // Touch state
    let paddleTargetX = null;
    let touchActive = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let touchMoved = false;
    const TAP_MAX_DIST = 12;
    const TAP_MAX_TIME = 250;

    let levelTransitionTimer = 0;
    const LEVEL_TRANSITION_DURATION = 90;

    // ---------- LEVELS ----------
    function loadLevel(index) {
      const pattern = LEVELS[index % LEVELS.length];
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        bricks[r] = [];
        const rowStr = r < pattern.length ? pattern[r] : "";
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks[r][c] = (rowStr[c] === '#') ? 1 : 0;
        }
      }
    }

    function resetBallAndPaddle() {
      paddleWidth = PADDLE_WIDTH;
      paddleX = (CW - paddleWidth) / 2;
      ballX = paddleX + paddleWidth / 2;
      ballY = PADDLE_Y - BALL_RADIUS - 1;
      ballDX = 0;
      ballDY = 0;
      ballActive = false;
      extraBalls = [];
      powerUps = [];
      // Clear timed power-ups
      activePowerUps.expand = 0;
      activePowerUps.shrink = 0;
      activePowerUps.slow = 0;
      activePowerUps.sticky = 0;
      paddleTargetX = null;
      touchActive = false;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      levelIndex = 0;
      gameOver = false;
      gameWin = false;
      levelCleared = false;
      levelTransitionTimer = 0;
      particles = [];
      loadLevel(levelIndex);
      resetBallAndPaddle();
      updateUI();
    }

    function advanceLevel() {
      levelIndex++;
      if (levelIndex >= LEVELS.length) {
        gameWin = true;
        ballActive = false;
        extraBalls = [];
        return;
      }
      loadLevel(levelIndex);
      resetBallAndPaddle();
      levelCleared = false;
      levelTransitionTimer = 0;
      updateUI();
    }

    function updateUI() {
      scoreSpan.textContent = score;
      livesSpan.textContent = lives;
      levelSpan.textContent = (levelIndex % LEVELS.length) + 1;
    }

    // ---------- PARTICLES ----------
    function spawnBurst(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3.5;
        particles.push({
          x, y,
          dx: Math.cos(a) * sp,
          dy: Math.sin(a) * sp,
          life: 1,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.05;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // ---------- POWER-UP DROPS ----------
    function tryDropPowerUp(x, y) {
      if (Math.random() > POWERUP_CHANCE) return;
      const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
      powerUps.push({
        x,
        y,
        type: type.id,
        color: type.color,
        letter: type.letter
      });
    }

    function applyPowerUp(type) {
      const idx = type.id;
      if (idx === 'expand') {
        paddleWidth = PADDLE_WIDTH + PADDLE_WIDE_EXTRA;
        activePowerUps.expand = POWERUP_DURATION;
        activePowerUps.shrink = 0;       // cancel opposite
        // keep paddle in bounds
        paddleX = Math.min(paddleX, CW - paddleWidth);
      } else if (idx === 'shrink') {
        paddleWidth = Math.max(50, PADDLE_WIDTH - PADDLE_NARROW_LOSS);
        activePowerUps.shrink = POWERUP_DURATION;
        activePowerUps.expand = 0;
        paddleX = Math.min(paddleX, CW - paddleWidth);
      } else if (idx === 'multi') {
        // spawn 2 extra balls from current ball position
        if (ballActive) {
          for (let i = 0; i < 2; i++) {
            const a = Math.random() * Math.PI * 2;
            extraBalls.push({
              x: ballX, y: ballY,
              dx: Math.cos(a) * MULTIBALL_SPEED,
              dy: Math.sin(a) * MULTIBALL_SPEED
            });
          }
        }
      } else if (idx === 'slow') {
        activePowerUps.slow = POWERUP_DURATION;
        // scale down ball velocities (main + extras)
        ballDX *= 0.65; ballDY *= 0.65;
        for (const b of extraBalls) { b.dx *= 0.65; b.dy *= 0.65; }
      } else if (idx === 'extra') {
        lives++;
        updateUI();
      } else if (idx === 'sticky') {
        activePowerUps.sticky = POWERUP_DURATION;
      }
      spawnBurst(paddleX + paddleWidth / 2, PADDLE_Y, type.color, 16);
    }

    // ---------- LAUNCH ----------
    function launchBall() {
      if (ballActive || gameOver || gameWin || levelCleared) return;
      ballActive = true;
      const angleUp = (Math.random() * 0.6 + 0.2) * Math.PI;
      ballDX = Math.cos(angleUp) * BALL_SPEED;
      ballDY = -Math.sin(angleUp) * BALL_SPEED;
      if (Math.abs(ballDY) < 1.8) {
        const sign = ballDY > 0 ? 1 : -1;
        ballDY = sign * 2.2;
        const len = Math.hypot(ballDX, ballDY);
        ballDX = (ballDX / len) * BALL_SPEED;
        ballDY = (ballDY / len) * BALL_SPEED;
      }
    }

    // ---------- BRICK COLLISION ----------
    // Returns true if the ball hit a brick (used to stop after one collision per frame).
    function ballBrickCollision(ball) {
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;
          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);
          const closestX = Math.max(brickX, Math.min(ball.x, brickX + BRICK_WIDTH));
          const closestY = Math.max(brickY, Math.min(ball.y, brickY + BRICK_HEIGHT));
          const dx = ball.x - closestX;
          const dy = ball.y - closestY;
          if (dx * dx + dy * dy < BALL_RADIUS * BALL_RADIUS) {
            bricks[r][c] = 0;
            score += 10;
            updateUI();
            spawnBurst(closestX, closestY, `hsl(${(r * 22 + levelIndex * 37 + 180) % 360}, 70%, 60%)`, 8);
            tryDropPowerUp(brickX + BRICK_WIDTH / 2, brickY + BRICK_HEIGHT / 2);

            const oL = (ball.x + BALL_RADIUS) - brickX;
            const oR = (brickX + BRICK_WIDTH) - (ball.x - BALL_RADIUS);
            const oT = (ball.y + BALL_RADIUS) - brickY;
            const oB = (brickY + BRICK_HEIGHT) - (ball.y - BALL_RADIUS);
            const minX = Math.min(oL, oR);
            const minY = Math.min(oT, oB);

            if (minX < minY) {
              ball.dx = -ball.dx;
              if (oL < oR) ball.x = brickX - BALL_RADIUS - 0.1;
              else ball.x = brickX + BRICK_WIDTH + BALL_RADIUS + 0.1;
            } else {
              ball.dy = -ball.dy;
              if (oT < oB) ball.y = brickY - BALL_RADIUS - 0.1;
              else ball.y = brickY + BRICK_HEIGHT + BALL_RADIUS + 0.1;
            }

            // Level cleared check
            const anyLeft = bricks.some(row => row.some(cell => cell === 1));
            if (!anyLeft) {
              levelCleared = true;
              ballActive = false;
              extraBalls = [];
              levelTransitionTimer = LEVEL_TRANSITION_DURATION;
            }
            return true;
          }
        }
      }
      return false;
    }

    // ---------- UPDATE ----------
    function update() {
      // Particle updates happen even during transitions
      updateParticles();

      // Level transition
      if (levelCleared) {
        // Still let power-ups fall and particles animate
        updatePowerUps();
        if (levelTransitionTimer > 0) levelTransitionTimer--;
        else advanceLevel();
        return;
      }

      if (gameOver || gameWin) {
        updatePowerUps();
        return;
      }

      // ---- Power-up timers ----
      for (const k in activePowerUps) {
        if (activePowerUps[k] > 0) activePowerUps[k]--;
        if (activePowerUps[k] === 0) {
          if (k === 'expand' || k === 'shrink') {
            // revert paddle width
            const center = paddleX + paddleWidth / 2;
            paddleWidth = PADDLE_WIDTH;
            paddleX = Math.max(0, Math.min(CW - paddleWidth, center - paddleWidth / 2));
          }
          if (k === 'slow') {
            // restore speed
            const restore = (b) => {
              const len = Math.hypot(b.dx, b.dy);
              if (len > 0) { b.dx = b.dx / len * BALL_SPEED; b.dy = b.dy / len * BALL_SPEED; }
            };
            restore({ dx: ballDX, dy: ballDY }); // doesn't mutate real ball; do it manually below
            const normalize = (vx, vy) => {
              const len = Math.hypot(vx, vy);
              if (len === 0) return [0, 0];
              return [vx / len * BALL_SPEED, vy / len * BALL_SPEED];
            };
            [ballDX, ballDY] = normalize(ballDX, ballDY);
            for (const b of extraBalls) {
              [b.dx, b.dy] = normalize(b.dx, b.dy);
            }
          }
        }
      }

      // ---- Paddle movement ----
      if (paddleTargetX !== null) {
        const desired = paddleTargetX - paddleWidth / 2;
        const clamped = Math.max(0, Math.min(CW - paddleWidth, desired));
        const diff = clamped - paddleX;
        if (Math.abs(diff) < 0.5) paddleX = clamped;
        else paddleX += diff * 0.45;
      } else {
        if (leftPressed) paddleX = Math.max(0, paddleX - PADDLE_SPEED);
        if (rightPressed) paddleX = Math.min(CW - paddleWidth, paddleX + PADDLE_SPEED);
      }

      // ---- Update falling power-ups ----
      updatePowerUps();

      // ---- Ball(s) ----
      if (!ballActive) {
        ballX = paddleX + paddleWidth / 2;
        ballY = PADDLE_Y - BALL_RADIUS - 1;
        // Extra balls shouldn't exist if main is inactive; clear just in case
        extraBalls = [];
        return;
      }

      // Main ball
      moveBall(ballX, ballY, ballDX, ballDY, true);
      // The moveBall function returns new state; let's handle main + extras with a unified pass.
      // Simpler: rewrite inline below.

      // Actually, do the unified step now:
      stepBall(mainBallProxy(), true);
      for (let i = extraBalls.length - 1; i >= 0; i--) {
        const before = extraBalls.length;
        stepBall(extraBalls[i], false);
        if (extraBalls.length < before) {
          // ball was lost
          continue;
        }
      }

      // Re-sync main ball state from proxy
      ballX = mainBall.x;
      ballY = mainBall.y;
      ballDX = mainBall.dx;
      ballDY = mainBall.dy;

      // Bottom: check main ball loss
      if (ballY - BALL_RADIUS > CH) {
        // If extra balls exist, promote one to main
        if (extraBalls.length > 0) {
          const b = extraBalls.shift();
          ballX = b.x; ballY = b.y; ballDX = b.dx; ballDY = b.dy;
          mainBall.x = ballX; mainBall.y = ballY; mainBall.dx = ballDX; mainBall.dy = ballDY;
        } else {
          // Lose a life
          lives--;
          updateUI();
          if (lives <= 0) {
            gameOver = true;
            ballActive = false;
            ballX = paddleX + paddleWidth / 2;
            ballY = PADDLE_Y - BALL_RADIUS - 1;
            ballDX = 0; ballDY = 0;
            extraBalls = [];
            powerUps = [];
          } else {
            resetBallAndPaddle();
          }
        }
      }
    }

    // Hmm, let me restructure: this got messy with proxies. Let me use a cleaner approach.
    // (Rewrite below — I'll replace the update body.)

    // ---------- CLEANER BALL PHYSICS ----------
    // We keep the main ball in ballX/ballY/ballDX/ballDY and extraBalls as objects.
    // stepBallState(b) mutates b in place. Returns 'lost' if it went off the bottom.
    function stepBallState(b, isMain) {
      b.x += b.dx;
      b.y += b.dy;

      // walls
      if (b.x - BALL_RADIUS < 0) { b.x = BALL_RADIUS; b.dx = -b.dx; }
      else if (b.x + BALL_RADIUS > CW) { b.x = CW - BALL_RADIUS; b.dx = -b.dx; }
      if (b.y - BALL_RADIUS < 0) { b.y = BALL_RADIUS; b.dy = -b.dy; }

      // paddle
      if (b.dy > 0 &&
          b.y + BALL_RADIUS >= PADDLE_Y &&
          b.y - BALL_RADIUS <= PADDLE_Y + PADDLE_HEIGHT &&
          b.x + BALL_RADIUS >= paddleX &&
          b.x - BALL_RADIUS <= paddleX + paddleWidth) {
        b.dy = -b.dy;
        const hitPos = (b.x - paddleX) / paddleWidth;
        const angle = (hitPos - 0.5) * 1.6;
        const speed = Math.hypot(b.dx, b.dy);
        b.dx = Math.sin(angle) * speed;
        b.dy = -Math.abs(Math.cos(angle)) * speed;
        b.y = PADDLE_Y - BALL_RADIUS - 0.5;

        // Sticky power-up: stop ball on paddle
        if (activePowerUps.sticky > 0 && isMain) {
          // Main ball becomes inactive (sticks); we can absorb extras? keep simple
          // We'll handle stickiness by zeroing dx/dy and marking ballActive=false after loop
          b.dx = 0; b.dy = 0;
          b.x = paddleX + paddleWidth / 2;
          b.y = PADDLE_Y - BALL_RADIUS - 1;
          b.stuck = true;
        }
      }

      // bricks
      if (ballBrickCollision(b)) {
        // handled; one collision per frame per ball
      }

      // bottom
      if (b.y - BALL_RADIUS > CH) return 'lost';
      return 'ok';
    }

    // ---------- REVISED UPDATE ----------
    // Replace the update function entirely for clarity.
    update = function() {
      updateParticles();

      if (levelCleared) {
        updatePowerUps();
        if (levelTransitionTimer > 0) levelTransitionTimer--;
        else advanceLevel();
        return;
      }
      if (gameOver || gameWin) {
        updatePowerUps();
        return;
      }

      // Power-up timers
      for (const k in activePowerUps) {
        if (activePowerUps[k] > 0) activePowerUps[k]--;
        if (activePowerUps[k] === 0) {
          if (k === 'expand' || k === 'shrink') {
            const center = paddleX + paddleWidth / 2;
            paddleWidth = PADDLE_WIDTH;
            paddleX = Math.max(0, Math.min(CW - paddleWidth, center - paddleWidth / 2));
          }
          if (k === 'slow') {
            const norm = (vx, vy) => {
              const len = Math.hypot(vx, vy);
              if (len === 0) return [0, 0];
              return [vx / len * BALL_SPEED, vy / len * BALL_SPEED];
            };
            [ballDX, ballDY] = norm(ballDX, ballDY);
            for (const b of extraBalls) {
              [b.dx, b.dy] = norm(b.dx, b.dy);
            }
          }
        }
      }

      // Paddle
      if (paddleTargetX !== null) {
        const desired = paddleTargetX - paddleWidth / 2;
        const clamped = Math.max(0, Math.min(CW - paddleWidth, desired));
        const diff = clamped - paddleX;
        if (Math.abs(diff) < 0.5) paddleX = clamped;
        else paddleX += diff * 0.45;
      } else {
        if (leftPressed) paddleX = Math.max(0, paddleX - PADDLE_SPEED);
        if (rightPressed) paddleX = Math.min(CW - paddleWidth, paddleX + PADDLE_SPEED);
      }

      updatePowerUps();

      if (!ballActive) {
        ballX = paddleX + paddleWidth / 2;
        ballY = PADDLE_Y - BALL_RADIUS - 1;
        extraBalls = [];
        return;
      }

      // Step main ball
      const main = { x: ballX, y: ballY, dx: ballDX, dy: ballDY };
      // If sticky and stuck, skip physics
      if (main.dy === 0 && main.dx === 0 && activePowerUps.sticky > 0) {
        main.x = paddleX + paddleWidth / 2;
        main.y = PADDLE_Y - BALL_RADIUS - 1;
        // Check if player launched (tap/space) — handled elsewhere by launchBall
        // If they launched, ballActive is still true but dx/dy zero.
        // We'll treat zero-velocity as "stuck"; launchBall will re-enable physics.
        ballX = main.x; ballY = main.y;
        // Also step extras independently
      } else {
        const res = stepBallState(main, true);
        ballX = main.x; ballY = main.y; ballDX = main.dx; ballDY = main.dy;
        if (res === 'lost') {
          // promote an extra ball if available
          if (extraBalls.length > 0) {
            const e = extraBalls.shift();
            ballX = e.x; ballY = e.y; ballDX = e.dx; ballDY = e.dy;
          } else {
            lives--;
            updateUI();
            if (lives <= 0) {
              gameOver = true; ballActive = false;
              ballX = paddleX + paddleWidth / 2;
              ballY = PADDLE_Y - BALL_RADIUS - 1;
              ballDX = 0; ballDY = 0; extraBalls = [];
            } else {
              resetBallAndPaddle();
            }
            return;
          }
        }
      }

      // Step extra balls
      for (let i = extraBalls.length - 1; i >= 0; i--) {
        const e = extraBalls[i];
        const res = stepBallState(e, false);
        if (res === 'lost') {
          extraBalls.splice(i, 1);
        }
      }

      // If sticky and ball is at rest on paddle, sync position
      if (activePowerUps.sticky > 0 && ballDX === 0 && ballDY === 0) {
        ballX = paddleX + paddleWidth / 2;
        ballY = PADDLE_Y - BALL_RADIUS - 1;
      }
    };

    // ---------- POWER-UP UPDATER ----------
    function updatePowerUps() {
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.y += POWERUP_FALL_SPEED;

        // Catch by paddle?
        if (pu.y + POWERUP_SIZE / 2 >= PADDLE_Y &&
            pu.y - POWERUP_SIZE / 2 <= PADDLE_Y + PADDLE_HEIGHT &&
            pu.x + POWERUP_SIZE / 2 >= paddleX &&
            pu.x - POWERUP_SIZE / 2 <= paddleX + paddleWidth) {
          applyPowerUp(pu);
          powerUps.splice(i, 1);
          continue;
        }
        // Off screen
        if (pu.y - POWERUP_SIZE > CH) {
          powerUps.splice(i, 1);
        }
      }
    }

    // ---------- DRAW ----------
    function draw() {
      ctx.clearRect(0, 0, CW, CH);

      const grad = ctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#0a1020');
      grad.addColorStop(1, '#141e30');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CW, CH);

      ctx.fillStyle = '#ffffff08';
      for (let i = 0; i < CW; i += 40) {
        for (let j = 0; j < CH; j += 40) {
          ctx.beginPath();
          ctx.arc(i, j, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // bricks
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;
          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);
          const hue = (r * 22 + levelIndex * 37 + 180) % 360;
          ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
          ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.roundRect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT, 6);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = `hsl(${hue}, 90%, 85%)`;
          ctx.beginPath();
          ctx.roundRect(brickX + 2, brickY + 2, BRICK_WIDTH - 4, BRICK_HEIGHT - 6, 4);
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // power-ups
      for (const pu of powerUps) {
        ctx.shadowColor = pu.color;
        ctx.shadowBlur = 18;
        ctx.fillStyle = pu.color;
        ctx.beginPath();
        ctx.roundRect(pu.x - POWERUP_SIZE / 2, pu.y - POWERUP_SIZE / 2,
                      POWERUP_SIZE, POWERUP_SIZE, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#00000099';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pu.letter, pu.x, pu.y + 1);
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      // paddle
      ctx.shadowColor = '#b0c8ff';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#b7d0ff';
      ctx.beginPath();
      ctx.roundRect(paddleX, PADDLE_Y, paddleWidth, PADDLE_HEIGHT, 12);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#e4eeff';
      ctx.beginPath();
      ctx.roundRect(paddleX + 4, PADDLE_Y + 2, paddleWidth - 8, 6, 6);
      ctx.fill();

      // extra balls
      for (const b of extraBalls) {
        ctx.shadowColor = '#fff9c4';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#fff9e6';
        ctx.beginPath();
        ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.arc(b.x - 2, b.y - 2, BALL_RADIUS - 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // main ball
      ctx.shadowColor = '#fff9c4';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#fff9e6';
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(ballX - 2, ballY - 2, BALL_RADIUS - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Active power-up indicators (top-right pills)
      drawActivePowerUps();

      // messages
      ctx.textAlign = 'center';
      if (levelCleared && levelTransitionTimer > 0) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#a8ffb0';
        ctx.shadowColor = '#008822';
        ctx.shadowBlur = 28;
        ctx.fillText('LEVEL CLEARED!', CW / 2, CH / 2 - 10);
        ctx.font = '22px monospace';
        ctx.fillStyle = '#ddffdd';
        ctx.fillText(`next: level ${((levelIndex + 1) % LEVELS.length) + 1}`, CW / 2, CH / 2 + 44);
        ctx.shadowBlur = 0;
      } else if (gameOver) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#ffb3b3';
        ctx.shadowColor = '#aa0000';
        ctx.shadowBlur = 24;
        ctx.fillText('GAME OVER', CW / 2, CH / 2 - 20);
        ctx.font = '22px monospace';
        ctx.fillStyle = '#ffdddd';
        ctx.fillText(`score ${score} · tap or press R to restart`, CW / 2, CH / 2 + 50);
        ctx.shadowBlur = 0;
      } else if (gameWin) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#f5e56b';
        ctx.shadowColor = '#b8860b';
        ctx.shadowBlur = 28;
        ctx.fillText('✨ ALL LEVELS ✨', CW / 2, CH / 2 - 20);
        ctx.font = '28px monospace';
        ctx.fillStyle = '#ffffcf';
        ctx.fillText('YOU WIN', CW / 2, CH / 2 + 28);
        ctx.font = '22px monospace';
        ctx.fillText('tap or press R to restart', CW / 2, CH / 2 + 70);
        ctx.shadowBlur = 0;
      } else if (!ballActive) {
        ctx.font = 'bold 22px "Segoe UI", monospace';
        ctx.fillStyle = '#b9d0ff';
        ctx.shadowColor = '#3a5f9e';
        ctx.shadowBlur = 12;
        ctx.fillText('tap or press SPACE to launch', CW / 2, CH - 100);
        ctx.shadowBlur = 0;
      }
      ctx.textAlign = 'left';
    }

    function drawActivePowerUps() {
      const items = [];
      if (activePowerUps.expand > 0) items.push({ color: '#4ade80', label: 'WIDE', t: activePowerUps.expand });
      if (activePowerUps.shrink > 0) items.push({ color: '#f87171', label: 'NARROW', t: activePowerUps.shrink });
      if (activePowerUps.slow > 0)   items.push({ color: '#a78bfa', label: 'SLOW', t: activePowerUps.slow });
      if (activePowerUps.sticky > 0) items.push({ color: '#f472b6', label: 'STICKY', t: activePowerUps.sticky });

      let y = 12;
      for (const it of items) {
        const secs = Math.ceil(it.t / 60);
        const text = `${it.label} ${secs}s`;
        ctx.font = 'bold 13px monospace';
        const w = ctx.measureText(text).width + 20;
        ctx.fillStyle = it.color + '33';
        ctx.strokeStyle = it.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(CW - w - 14, y, w, 24, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = it.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, CW - w / 2 - 14, y + 12);
        y += 30;
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    // ---------- ROUND RECT ----------
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
      };
    }

    // ---------- LOOP ----------
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ---------- COORD ----------
    function clientToCanvas(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = CW / rect.width;
      const scaleY = CH / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    // ---------- TOUCH ----------
    function onTouchStart(e) {
      if (e.touches.length > 1) return;
      e.preventDefault();
      const t = e.touches[0];
      const pt = clientToCanvas(t.clientX, t.clientY);
      touchActive = true;
      paddleTargetX = pt.x;
      touchStartX = pt.x; touchStartY = pt.y;
      touchStartTime = performance.now();
      touchMoved = false;
    }
    function onTouchMove(e) {
      if (!touchActive || e.touches.length > 1) return;
      e.preventDefault();
      const t = e.touches[0];
      const pt = clientToCanvas(t.clientX, t.clientY);
      if (Math.hypot(pt.x - touchStartX, pt.y - touchStartY) > TAP_MAX_DIST) touchMoved = true;
      paddleTargetX = pt.x;
    }
    function onTouchEnd(e) {
      if (!touchActive) return;
      if (e.touches.length > 0) return;
      e.preventDefault();
      const duration = performance.now() - touchStartTime;
      const wasTap = !touchMoved && duration < TAP_MAX_TIME;
      touchActive = false;
      paddleTargetX = null;
      if (wasTap) {
        if (gameOver || gameWin) fullRestart();
        else if (!ballActive && !levelCleared) launchBall();
        else if (ballActive && ballDX === 0 && ballDY === 0 && activePowerUps.sticky > 0) {
          // launch stuck ball
          launchBall();
        }
      }
    }
    function onTouchCancel() {
      touchActive = false;
      paddleTargetX = null;
      touchMoved = false;
    }
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchCancel, { passive: false });

    // mouse
    let mouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
      mouseDown = true;
      const pt = clientToCanvas(e.clientX, e.clientY);
      touchActive = true;
      paddleTargetX = pt.x;
      touchStartX = pt.x; touchStartY = pt.y;
      touchStartTime = performance.now();
      touchMoved = false;
    });
    window.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
      const pt = clientToCanvas(e.clientX, e.clientY);
      if (Math.hypot(pt.x - touchStartX, pt.y - touchStartY) > TAP_MAX_DIST) touchMoved = true;
      paddleTargetX = pt.x;
    });
    window.addEventListener('mouseup', () => {
      if (!mouseDown) return;
      mouseDown = false;
      const duration = performance.now() - touchStartTime;
      const wasTap = !touchMoved && duration < TAP_MAX_TIME;
      touchActive = false;
      paddleTargetX = null;
      if (wasTap) {
        if (gameOver || gameWin) fullRestart();
        else if (!ballActive && !levelCleared) launchBall();
        else if (ballActive && ballDX === 0 && ballDY === 0 && activePowerUps.sticky > 0) {
          launchBall();
        }
      }
    });

    // ---------- KEYBOARD ----------
    function handleKeyDown(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        leftPressed = true; paddleTargetX = null; touchActive = false; e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        rightPressed = true; paddleTargetX = null; touchActive = false; e.preventDefault();
      } else if (key === ' ') {
        if (!ballActive && !gameOver && !gameWin && !levelCleared) launchBall();
        else if (ballActive && ballDX === 0 && ballDY === 0 && activePowerUps.sticky > 0) launchBall();
        e.preventDefault();
      } else if (key === 'r' || key === 'R') {
        fullRestart(); e.preventDefault();
      }
    }
    function handleKeyUp(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        leftPressed = false; e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        rightPressed = false; e.preventDefault();
      } else if (key === ' ') {
        e.preventDefault();
      }
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    // ---------- RESTART ----------
    function fullRestart() {
      resetGame();
    }
    document.getElementById('restartButton').addEventListener('click', fullRestart);

    // ---------- START ----------
    resetGame();
    gameLoop();

  })();
</script>
</body>
</html>
