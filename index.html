<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bяeakout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #0b0f1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, monospace;
    }

    .game-wrapper {
      background: #131a2c;
      padding: 1.5rem 2rem 2rem 2rem;
      border-radius: 3rem 3rem 2.5rem 2.5rem;
      box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #2e3b5e;
    }

    canvas {
      display: block;
      width: 800px;
      height: 500px;
      border-radius: 1.8rem;
      background: #0e1424;
      box-shadow: inset 0 0 40px #00000055, 0 8px 0 #05080f;
      cursor: none;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.8rem 0.5rem 0 0.5rem;
      color: #b9c8ff;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 3px black;
    }

    .score, .lives {
      background: #1d2742;
      padding: 0.35rem 1.2rem;
      border-radius: 30px;
      box-shadow: inset 0 3px 6px #00000060, 0 4px 0 #0b0f1a;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .score span, .lives span {
      color: #f7f0b9;
      font-size: 1.6rem;
      font-weight: 800;
      min-width: 2.2rem;
      text-align: center;
      text-shadow: 0 0 12px #ffd966;
    }

    .restart-btn {
      background: #2a3759;
      border: none;
      color: #dee9ff;
      font-weight: bold;
      padding: 0.4rem 1.8rem;
      border-radius: 40px;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 0 #0e121f, 0 8px 10px black;
      cursor: pointer;
      transition: 0.08s ease;
      text-transform: uppercase;
    }

    .restart-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #0e121f, 0 5px 10px black;
    }

    .hint {
      color: #7b8bc0;
      font-size: 0.9rem;
      margin-left: 1rem;
      font-weight: 400;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="status-bar">
    <div class="score">🎯 SCORE <span id="scoreDisplay">0</span></div>
    <div class="lives">❤️ LIVES <span id="livesDisplay">3</span></div>
    <button class="restart-btn" id="restartButton">↻ restart</button>
  </div>
  <div class="hint">← → move · SPACE launch · click restart</div>
</div>

<script>
  (function() {
    // ---------- CANVAS & CONTEXT ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const livesSpan = document.getElementById('livesDisplay');

    // ---------- FIXED DIMENSIONS ----------
    const CW = 800;
    const CH = 500;

    // ---------- GAME CONSTANTS ----------
    const PADDLE_WIDTH = 120;
    const PADDLE_HEIGHT = 16;
    const PADDLE_Y = CH - 40;          // 460
    const PADDLE_SPEED = 8;

    const BALL_RADIUS = 8;
    const BALL_SPEED = 5.5;

    const BRICK_COLS = 10;
    const BRICK_ROWS = 5;
    const BRICK_WIDTH = 68;
    const BRICK_HEIGHT = 22;
    const BRICK_PADDING = 6;
    const BRICK_OFFSET_X = (CW - (BRICK_COLS * (BRICK_WIDTH + BRICK_PADDING) - BRICK_PADDING)) / 2;
    const BRICK_OFFSET_Y = 60;

    // ---------- GAME STATE ----------
    let leftPressed = false;
    let rightPressed = false;
    let spacePressed = false;          // used for launch

    // paddle
    let paddleX = (CW - PADDLE_WIDTH) / 2;

    // ball
    let ballX = CW / 2;
    let ballY = PADDLE_Y - BALL_RADIUS - 1;   // rest right above paddle
    let ballDX = 0;
    let ballDY = 0;
    let ballActive = false;            // false = stuck on paddle

    // bricks: 2D array [row][col] = 1 (alive) or 0 (destroyed)
    let bricks = [];

    // score & lives
    let score = 0;
    let lives = 3;

    // game flags
    let gameOver = false;              // no lives left
    let gameWin = false;              // all bricks cleared
    let awaitingRestart = false;      // optional, but we auto-reset via restart button

    // ---------- INIT / RESET ----------
    function initBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        bricks[r] = [];
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks[r][c] = 1;            // all alive
        }
      }
    }

    function resetBallAndPaddle() {
      // paddle centered
      paddleX = (CW - PADDLE_WIDTH) / 2;
      // ball resting on paddle
      ballX = paddleX + PADDLE_WIDTH / 2;
      ballY = PADDLE_Y - BALL_RADIUS - 1;
      ballDX = 0;
      ballDY = 0;
      ballActive = false;
    }

    function resetGame() {
      // reset score & lives
      score = 0;
      lives = 3;
      gameOver = false;
      gameWin = false;
      awaitingRestart = false;

      // rebuild bricks
      initBricks();

      // reset paddle & ball
      resetBallAndPaddle();

      // update displays
      updateUI();
    }

    // full restart (button / click)
    function fullRestart() {
      resetGame();
    }

    // ---------- UI UPDATE ----------
    function updateUI() {
      scoreSpan.textContent = score;
      livesSpan.textContent = lives;
    }

    // ---------- LAUNCH BALL (if inactive and game not over/win) ----------
    function launchBall() {
      if (ballActive) return;
      if (gameOver || gameWin) return;   // don't launch if game finished

      // ball must be on paddle
      ballActive = true;

      // random angle (avoid pure horizontal/vertical)
      const angle = (Math.random() * 0.7 + 0.3) * Math.PI; // 0.3pi to 1.0pi? but we want upward (negative dy)
      // better: choose angle between 30° and 150° from horizontal, but directed upward
      const randomAngle = (Math.random() * 0.8 + 0.1) * Math.PI; // 0.1pi .. 0.9pi? then dy negative
      // simpler: use fixed range: -60° to -120° (or 240° to 300°)
      // let's do: direction between -70° and -110° (upwards)
      const rad = (Math.random() * 0.6 + 0.2) * Math.PI; // 0.2pi ~ 36° to 0.8pi ~ 144° but we need upward: dy negative
      // Actually we want angle measured from positive x axis, with dy negative => angle between 180+?
      // easier: set dx = cos(angle), dy = -sin(angle) with angle in [0.2pi, 0.8pi]
      const angleUp = (Math.random() * 0.6 + 0.2) * Math.PI; // 0.2pi to 0.8pi (36° to 144°)
      ballDX = Math.cos(angleUp) * BALL_SPEED;
      ballDY = -Math.sin(angleUp) * BALL_SPEED;

      // ensure not too horizontal (avoid infinite loops)
      if (Math.abs(ballDY) < 1.8) {
        // adjust to give more vertical component
        const sign = ballDY > 0 ? 1 : -1;
        ballDY = sign * 2.2;
        // renormalize speed
        const len = Math.hypot(ballDX, ballDY);
        ballDX = (ballDX / len) * BALL_SPEED;
        ballDY = (ballDY / len) * BALL_SPEED;
      }
    }

    // ---------- COLLISION DETECTION (bricks) ----------
    function ballBrickCollision() {
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;

          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);

          // closest point on brick to ball center
          const closestX = Math.max(brickX, Math.min(ballX, brickX + BRICK_WIDTH));
          const closestY = Math.max(brickY, Math.min(ballY, brickY + BRICK_HEIGHT));

          const dx = ballX - closestX;
          const dy = ballY - closestY;
          const distSq = dx * dx + dy * dy;

          if (distSq < BALL_RADIUS * BALL_RADIUS) {
            // brick hit!
            bricks[r][c] = 0;
            score += 10;
            updateUI();

            // Determine bounce direction based on overlap
            const overlapLeft   = (ballX + BALL_RADIUS) - brickX;
            const overlapRight  = (brickX + BRICK_WIDTH) - (ballX - BALL_RADIUS);
            const overlapTop    = (ballY + BALL_RADIUS) - brickY;
            const overlapBottom = (brickY + BRICK_HEIGHT) - (ballY - BALL_RADIUS);

            const minOverlapX = Math.min(overlapLeft, overlapRight);
            const minOverlapY = Math.min(overlapTop, overlapBottom);

            // Resolve collision by minimal overlap
            if (minOverlapX < minOverlapY) {
              ballDX = -ballDX;
              // push ball out to avoid sticking
              if (overlapLeft < overlapRight) {
                ballX = brickX - BALL_RADIUS - 0.1;
              } else {
                ballX = brickX + BRICK_WIDTH + BALL_RADIUS + 0.1;
              }
            } else {
              ballDY = -ballDY;
              if (overlapTop < overlapBottom) {
                ballY = brickY - BALL_RADIUS - 0.1;
              } else {
                ballY = brickY + BRICK_HEIGHT + BALL_RADIUS + 0.1;
              }
            }

            // check win condition after brick removal
            if (bricks.every(row => row.every(cell => cell === 0))) {
              gameWin = true;
              ballActive = false;          // freeze ball
            }

            return; // one collision per frame (handles most cases well)
          }
        }
      }
    }

    // ---------- UPDATE GAME (called every frame) ----------
    function update() {
      // if game over / win, don't move ball or paddle (except paddle maybe not)
      if (gameOver || gameWin) {
        // still allow paddle movement? we can disable, but it's fine – we ignore ball
        return;
      }

      // ----- paddle movement -----
      if (leftPressed) {
        paddleX = Math.max(0, paddleX - PADDLE_SPEED);
      }
      if (rightPressed) {
        paddleX = Math.min(CW - PADDLE_WIDTH, paddleX + PADDLE_SPEED);
      }

      // ----- if ball not active, keep it on paddle -----
      if (!ballActive) {
        ballX = paddleX + PADDLE_WIDTH / 2;
        ballY = PADDLE_Y - BALL_RADIUS - 1;
        // if space pressed, launch (handled in keydown, but we also want to launch on space in update? better keydown)
        // we handle in keydown event.
        return; // no further ball movement
      }

      // ----- ball movement (active) -----
      ballX += ballDX;
      ballY += ballDY;

      // ----- wall collisions -----
      // left/right
      if (ballX - BALL_RADIUS < 0) {
        ballX = BALL_RADIUS;
        ballDX = -ballDX;
      } else if (ballX + BALL_RADIUS > CW) {
        ballX = CW - BALL_RADIUS;
        ballDX = -ballDX;
      }

      // top
      if (ballY - BALL_RADIUS < 0) {
        ballY = BALL_RADIUS;
        ballDY = -ballDY;
      }

      // ----- paddle collision (only if moving downward) -----
      if (ballDY > 0 &&
          ballY + BALL_RADIUS >= PADDLE_Y &&
          ballY - BALL_RADIUS <= PADDLE_Y + PADDLE_HEIGHT &&
          ballX + BALL_RADIUS >= paddleX &&
          ballX - BALL_RADIUS <= paddleX + PADDLE_WIDTH) {

        // reflect
        ballDY = -ballDY;

        // add spin based on where it hit the paddle
        const hitPos = (ballX - paddleX) / PADDLE_WIDTH; // 0..1
        const angle = (hitPos - 0.5) * 1.6;              // -0.8..0.8 rad
        const speed = Math.hypot(ballDX, ballDY);
        // new direction: preserve vertical speed sign (now negative)
        // convert to angle relative to vertical? easier: adjust dx and dy with normalized speed.
        const newDY = -Math.abs(Math.cos(angle)) * speed;
        const newDX = Math.sin(angle) * speed;
        ballDX = newDX;
        ballDY = newDY;

        // push ball above paddle to avoid sticky collision
        ballY = PADDLE_Y - BALL_RADIUS - 0.5;
      }

      // ----- brick collisions -----
      ballBrickCollision();

      // ----- bottom: ball lost? -----
      if (ballY - BALL_RADIUS > CH) {
        // lose a life
        lives--;
        updateUI();

        if (lives <= 0) {
          gameOver = true;
          ballActive = false;
          // ball remains? we can leave it invisible, but we set active false
          // reset ball to paddle for display but gameOver stops movement
          ballX = paddleX + PADDLE_WIDTH / 2;
          ballY = PADDLE_Y - BALL_RADIUS - 1;
          ballDX = 0;
          ballDY = 0;
        } else {
          // reset ball & paddle position (but keep bricks)
          resetBallAndPaddle();
        }
      }

      // (win condition already set inside ballBrickCollision, but if gameWin becomes true,
      //  we still stop ball on next update. fine)
    }

    // ---------- DRAWING ----------
    function draw() {
      ctx.clearRect(0, 0, CW, CH);

      // ---- background ----
      const grad = ctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#0a1020');
      grad.addColorStop(1, '#141e30');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CW, CH);
      // subtle grid dots
      ctx.fillStyle = '#ffffff08';
      for (let i = 0; i < CW; i += 40) {
        for (let j = 0; j < CH; j += 40) {
          ctx.beginPath();
          ctx.arc(i, j, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ---- bricks ----
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;

          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);

          // color by row
          const hue = (r * 20 + 180) % 360;
          ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
          ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.roundRect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT, 6);
          ctx.fill();

          // inner shine
          ctx.shadowBlur = 0;
          ctx.fillStyle = `hsl(${hue}, 90%, 85%)`;
          ctx.beginPath();
          ctx.roundRect(brickX + 2, brickY + 2, BRICK_WIDTH - 4, BRICK_HEIGHT - 6, 4);
          ctx.fill();
        }
      }
      // reset shadow
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // ---- paddle ----
      ctx.shadowColor = '#b0c8ff';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#b7d0ff';
      ctx.beginPath();
      ctx.roundRect(paddleX, PADDLE_Y, PADDLE_WIDTH, PADDLE_HEIGHT, 12);
      ctx.fill();
      // paddle highlight
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#e4eeff';
      ctx.beginPath();
      ctx.roundRect(paddleX + 4, PADDLE_Y + 2, PADDLE_WIDTH - 8, 6, 6);
      ctx.fill();

      // ---- ball ----
      ctx.shadowColor = '#fff9c4';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#fff9e6';
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      // ball inner glow
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(ballX - 2, ballY - 2, BALL_RADIUS - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // ---- game messages overlays ----
      if (gameOver) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#ffb3b3';
        ctx.shadowColor = '#aa0000';
        ctx.shadowBlur = 24;
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', CW / 2, CH / 2 - 20);
        ctx.font = '24px monospace';
        ctx.fillStyle = '#ffdddd';
        ctx.fillText('click restart', CW / 2, CH / 2 + 50);
        ctx.shadowBlur = 0;
      } else if (gameWin) {
        ctx.font = 'bold 48px "Segoe UI", monospace';
        ctx.fillStyle = '#f5e56b';
        ctx.shadowColor = '#b8860b';
        ctx.shadowBlur = 28;
        ctx.textAlign = 'center';
        ctx.fillText('✨ YOU WIN ✨', CW / 2, CH / 2 - 20);
        ctx.font = '24px monospace';
        ctx.fillStyle = '#ffffcf';
        ctx.fillText('click restart', CW / 2, CH / 2 + 50);
        ctx.shadowBlur = 0;
      } else if (!ballActive && !gameOver && !gameWin) {
        // show "press space" hint
        ctx.font = 'bold 22px "Segoe UI", monospace';
        ctx.fillStyle = '#b9d0ff';
        ctx.shadowColor = '#3a5f9e';
        ctx.shadowBlur = 12;
        ctx.textAlign = 'center';
        ctx.fillText('press SPACE to launch', CW / 2, CH - 100);
        ctx.shadowBlur = 0;
      }

      // reset alignment
      ctx.textAlign = 'left';
    }

    // ---------- ROUND RECT HELPER (polyfill) ----------
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
      };
    }

    // ---------- GAME LOOP ----------
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ---------- EVENT LISTENERS ----------
    function handleKeyDown(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        leftPressed = true;
        e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        rightPressed = true;
        e.preventDefault();
      } else if (key === ' ') {
        // space: launch if possible
        if (!ballActive && !gameOver && !gameWin) {
          launchBall();
        }
        e.preventDefault();  // prevent page scroll
      }
    }

    function handleKeyUp(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        leftPressed = false;
        e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        rightPressed = false;
        e.preventDefault();
      } else if (key === ' ') {
        e.preventDefault();
      }
    }

    // prevent window scrolling with arrows/space
    window.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
      }
    }, false);

    // attach main handlers
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    // restart button
    document.getElementById('restartButton').addEventListener('click', fullRestart);

    // optional: click on canvas also restarts if game over/win
    canvas.addEventListener('click', () => {
      if (gameOver || gameWin) {
        fullRestart();
      }
    });

    // also restart with 'r' key for convenience
    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        fullRestart();
        e.preventDefault();
      }
    });

    // ---------- START THE GAME ----------
    initBricks();
    resetBallAndPaddle();
    updateUI();
    gameLoop();

  })();
</script>
</body>
</html>
