<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BЯEAKOUT</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    body {
      background: #0b0f1a; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Segoe UI', system-ui, monospace; overflow: hidden;
    }
    .game-wrapper {
      background: #131a2c; padding: 1rem; border-radius: 2rem;
      box-shadow: 0 20px 30px -8px rgba(0,0,0,0.8), inset 0 0 0 1px #2e3b5e;
      max-width: 100vw; max-height: 100vh;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    canvas {
      display: block; width: 100%; height: auto;
      max-width: 800px; max-height: 70vh;
      aspect-ratio: 800 / 500; border-radius: 1.5rem;
      background: #0e1424;
      box-shadow: inset 0 0 40px #00000055, 0 8px 0 #05080f;
      touch-action: none;
    }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      color: #b9c8ff; font-weight: 600; letter-spacing: 0.5px;
      text-shadow: 0 2px 3px black; gap: 0.5rem; flex-wrap: wrap;
    }
    .score, .lives, .level {
      background: #1d2742; padding: 0.25rem 0.9rem; border-radius: 30px;
      box-shadow: inset 0 3px 6px #00000060, 0 4px 0 #0b0f1a;
      font-size: 1rem; display: flex; align-items: center; gap: 0.4rem;
    }
    .score span, .lives span, .level span {
      color: #f7f0b9; font-size: 1.2rem; font-weight: 800;
      min-width: 1.8rem; text-align: center; text-shadow: 0 0 12px #ffd966;
    }
    .restart-btn {
      background: #2a3759; border: none; color: #dee9ff; font-weight: bold;
      padding: 0.4rem 1.2rem; border-radius: 40px; font-size: 0.95rem;
      letter-spacing: 0.5px; box-shadow: 0 5px 0 #0e121f, 0 6px 8px black;
      cursor: pointer; transition: 0.08s ease; text-transform: uppercase;
    }
    .restart-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0e121f, 0 4px 8px black; }
    .hint { color: #7b8bc0; font-size: 0.8rem; text-align: center; font-weight: 400; letter-spacing: 0.3px; }
  </style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="status-bar">
    <div class="score">🎯 <span id="scoreDisplay">0</span></div>
    <div class="lives">❤️ <span id="livesDisplay">3</span></div>
    <div class="level">📁 <span id="levelDisplay">1</span></div>
    <button class="restart-btn" id="restartButton">↻</button>
    <button class="restart-btn" id="musicToggle" title="Toggle music">🎵</button>
  </div>
  <div class="hint">drag to move · tap to launch · ⌨️ ← → / space · R restart</div>
</div>

<script>
  (function() {
    // ================= CONFIG =================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const livesSpan = document.getElementById('livesDisplay');
    const levelSpan = document.getElementById('levelDisplay');

    let // ZzFXMicro - Zuper Zmall Zound Zynth - v1.4.0 by Frank Force

createBufferSource();b.buffer=p;b.connect(X.destination);b.start()}

    const CW = 800, CH = 500;
    const PADDLE_WIDTH = 120, PADDLE_HEIGHT = 16;
    const PADDLE_Y = CH - 40, PADDLE_SPEED = 8;
    const BALL_RADIUS = 8, BALL_SPEED = 5.5;

    const BRICK_COLS = 10, BRICK_ROWS = 8;
    const BRICK_WIDTH = 68, BRICK_HEIGHT = 22, BRICK_PADDING = 6;
    const BRICK_OFFSET_X = (CW - (BRICK_COLS * (BRICK_WIDTH + BRICK_PADDING) - BRICK_PADDING)) / 2;
    const BRICK_OFFSET_Y = 50;

    const POWERUP_CHANCE = 0.22;
    const POWERUP_FALL_SPEED = 2.4;
    const POWERUP_SIZE = 26;
    const POWERUP_DURATION = 480;
    const PADDLE_WIDE_EXTRA = 70;
    const PADDLE_NARROW_LOSS = 50;
    const MULTIBALL_SPEED = BALL_SPEED;

    const POWERUP_TYPES = [
      { id: 'expand', color: '#4ade80', letter: 'E' },
      { id: 'shrink', color: '#f87171', letter: 'S' },
      { id: 'multi',  color: '#60a5fa', letter: 'M' },
      { id: 'slow',   color: '#a78bfa', letter: '⏱' },
      { id: 'extra',  color: '#fbbf24', letter: '❤' },
      { id: 'sticky', color: '#f472b6', letter: '⊂' }
    ];

    const LEVELS = [
      ["##########","##########","##########","##########","##########"],
      ["....##....","...####...","..######..",".########.","##########"],
      ["#.#.#.#.#.",".#.#.#.#.#","#.#.#.#.#.",".#.#.#.#.#","#.#.#.#.#."],
      ["....##....","...####...","..######..",".########.","##########",".########.","..######..","...####..."],
      ["###....###","###....###","###....###","##########","###....###","###....###","###....###"],
      ["....##....","...####...","..######..",".########.","##########","....##....","....##....","....##...."],
      [".###..###.","##########","##########","##########",".########.","..######..","...####...","....##...."],
      ["##........",".###......","..#####...","...#######","....######","...#######","..#####...",".###......"],
      ["#.#.#.#.#.","#.#.#.#.#.","#.#.#.#.#.","#.#.#.#.#.","#.#.#.#.#.",".#.#.#.#.#","..#.#.#.#."],
      ["##########","#........#","#........#","#........#","#........#","#........#","#........#","##########"]
    ];

    // ================= STATE =================
    let leftPressed = false, rightPressed = false;
    let paddleX = (CW - PADDLE_WIDTH) / 2;
    let paddleWidth = PADDLE_WIDTH;

    let ballX = CW / 2, ballY = PADDLE_Y - BALL_RADIUS - 1;
    let ballDX = 0, ballDY = 0, ballActive = false;
    let ballStuck = false;

    let extraBalls = [];
    let bricks = [];
    let score = 0, lives = 3, levelIndex = 0;
    let gameOver = false, gameWin = false, levelCleared = false;

    const activePowerUps = { expand: 0, shrink: 0, slow: 0, sticky: 0 };
    let powerUps = [];
    let particles = [];

    let paddleTargetX = null, touchActive = false;
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0, touchMoved = false;
    const TAP_MAX_DIST = 12, TAP_MAX_TIME = 250;

    let levelTransitionTimer = 0;
    const LEVEL_TRANSITION_DURATION = 90;

    // ================= LEVELS =================
    function loadLevel(index) {
      const pattern = LEVELS[index % LEVELS.length];
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        bricks[r] = [];
        const rowStr = r < pattern.length ? pattern[r] : "";
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks[r][c] = (rowStr[c] === '#') ? 1 : 0;
        }
      }
    }

    function resetBallAndPaddle() {
      paddleWidth = PADDLE_WIDTH;
      paddleX = (CW - paddleWidth) / 2;
      ballX = paddleX + paddleWidth / 2;
      ballY = PADDLE_Y - BALL_RADIUS - 1;
      ballDX = 0; ballDY = 0;
      ballActive = false; ballStuck = false;
      extraBalls = [];
      powerUps = [];
      activePowerUps.expand = 0;
      activePowerUps.shrink = 0;
      activePowerUps.slow = 0;
      activePowerUps.sticky = 0;
      paddleTargetX = null; touchActive = false;
    }

    function resetGame() {
      score = 0; lives = 3; levelIndex = 0;
      gameOver = false; gameWin = false;
      levelCleared = false; levelTransitionTimer = 0;
      particles = [];
      loadLevel(levelIndex);
      resetBallAndPaddle();
      updateUI();
    }

    function advanceLevel() {
      levelIndex++;
      if (levelIndex >= LEVELS.length) {
        gameWin = true; ballActive = false; extraBalls = [];
        return;
      }
      loadLevel(levelIndex);
      resetBallAndPaddle();
      levelCleared = false;
      levelTransitionTimer = 0;
      updateUI();
    }

    function updateUI() {
      scoreSpan.textContent = score;
      livesSpan.textContent = lives;
      levelSpan.textContent = (levelIndex % LEVELS.length) + 1;
    }

    // ================= PARTICLES =================
    function spawnBurst(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3.5;
        particles.push({ x, y, dx: Math.cos(a)*sp, dy: Math.sin(a)*sp, life: 1, color });
      }
    }
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx; p.y += p.dy; p.dy += 0.05; p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // ================= POWER-UPS =================
    function tryDropPowerUp(x, y) {
      if (Math.random() > POWERUP_CHANCE) return;
      const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
      powerUps.push({ x, y, type: type.id, color: type.color, letter: type.letter });
    }

    function applyPowerUp(type) {
      if (type === 'expand') {
        paddleWidth = PADDLE_WIDTH + PADDLE_WIDE_EXTRA;
        paddleX = Math.min(paddleX, CW - paddleWidth);
        activePowerUps.expand = POWERUP_DURATION;
        activePowerUps.shrink = 0;
      } else if (type === 'shrink') {
        paddleWidth = Math.max(50, PADDLE_WIDTH - PADDLE_NARROW_LOSS);
        paddleX = Math.min(paddleX, CW - paddleWidth);
        activePowerUps.shrink = POWERUP_DURATION;
        activePowerUps.expand = 0;
      } else if (type === 'multi') {
        if (ballActive) {
          for (let i = 0; i < 2; i++) {
            const a = Math.random() * Math.PI * 2;
            extraBalls.push({
              x: ballX, y: ballY,
              dx: Math.cos(a) * MULTIBALL_SPEED,
              dy: Math.sin(a) * MULTIBALL_SPEED
            });
          }
        }
      } else if (type === 'slow') {
        activePowerUps.slow = POWERUP_DURATION;
        ballDX *= 0.65; ballDY *= 0.65;
        for (const b of extraBalls) { b.dx *= 0.65; b.dy *= 0.65; }
      } else if (type === 'extra') {
        lives++;
        updateUI();
      } else if (type === 'sticky') {
        activePowerUps.sticky = POWERUP_DURATION;
      }
      spawnBurst(paddleX + paddleWidth / 2, PADDLE_Y, '#ffffff', 16);
      zzfx(...[.6,,425,.02,.29,.28,,,-18,,,,,,17,,,.51,.12,,117]); // Powerup 20
    }


    function updatePowerUps() {
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.y += POWERUP_FALL_SPEED;

        if (pu.y + POWERUP_SIZE/2 >= PADDLE_Y &&
            pu.y - POWERUP_SIZE/2 <= PADDLE_Y + PADDLE_HEIGHT &&
            pu.x + POWERUP_SIZE/2 >= paddleX &&
            pu.x - POWERUP_SIZE/2 <= paddleX + paddleWidth) {
          applyPowerUp(pu.type);
          spawnBurst(pu.x, pu.y, pu.color, 20);
          powerUps.splice(i, 1);
          continue;
        }
        if (pu.y - POWERUP_SIZE > CH) powerUps.splice(i, 1);
      }
    }

    // ================= LAUNCH =================
    function launchBall() {
      if (gameOver || gameWin || levelCleared) return;
      if (ballActive && !ballStuck) return;

      ballActive = true;
      ballStuck = false;
      const angleUp = (Math.random() * 0.6 + 0.2) * Math.PI;
      ballDX = Math.cos(angleUp) * BALL_SPEED;
      ballDY = -Math.sin(angleUp) * BALL_SPEED;
      if (Math.abs(ballDY) < 1.8) {
        const sign = ballDY > 0 ? 1 : -1;
        ballDY = sign * 2.2;
        const len = Math.hypot(ballDX, ballDY);
        ballDX = (ballDX / len) * BALL_SPEED;
        ballDY = (ballDY / len) * BALL_SPEED;
      }
    }

    // ================= COLLISION =================
    function ballBrickCollision(b) {
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;
          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);
          const closestX = Math.max(brickX, Math.min(b.x, brickX + BRICK_WIDTH));
          const closestY = Math.max(brickY, Math.min(b.y, brickY + BRICK_HEIGHT));
          const dx = b.x - closestX, dy = b.y - closestY;
          if (dx*dx + dy*dy < BALL_RADIUS*BALL_RADIUS) {
            bricks[r][c] = 0;
            zzfx(...[2.7,,418,,.03,.02,1,2.2,,-20,,,.02,,14,,.26,.73,,.01,249]); // Blip 3
            score += 10;
            updateUI();
            spawnBurst(closestX, closestY, `hsl(${(r*22 + levelIndex*37 + 180) % 360}, 70%, 60%)`, 8);
            tryDropPowerUp(brickX + BRICK_WIDTH/2, brickY + BRICK_HEIGHT/2);

            const oL = (b.x + BALL_RADIUS) - brickX;
            const oR = (brickX + BRICK_WIDTH) - (b.x - BALL_RADIUS);
            const oT = (b.y + BALL_RADIUS) - brickY;
            const oB = (brickY + BRICK_HEIGHT) - (b.y - BALL_RADIUS);
            if (Math.min(oL, oR) < Math.min(oT, oB)) {
              b.dx = -b.dx;
              if (oL < oR) b.x = brickX - BALL_RADIUS - 0.1;
              else b.x = brickX + BRICK_WIDTH + BALL_RADIUS + 0.1;
            } else {
              b.dy = -b.dy;
              if (oT < oB) b.y = brickY - BALL_RADIUS - 0.1;
              else b.y = brickY + BRICK_HEIGHT + BALL_RADIUS + 0.1;
            }

            if (!bricks.some(row => row.some(cell => cell === 1))) {
              levelCleared = true;
              ballActive = false;
              extraBalls = [];
              levelTransitionTimer = LEVEL_TRANSITION_DURATION;
            }
            return true;
          }
        }
      }
      return false;
    }

    // ================= BALL PHYSICS =================
    // Mutates b in place. Returns 'lost' if it fell below the screen.
    function stepBallState(b, isMain) {
      b.x += b.dx;
      b.y += b.dy;

      if (b.x - BALL_RADIUS < 0) { b.x = BALL_RADIUS; b.dx = -b.dx; }
      else if (b.x + BALL_RADIUS > CW) { b.x = CW - BALL_RADIUS; b.dx = -b.dx; }
      if (b.y - BALL_RADIUS < 0) { b.y = BALL_RADIUS; b.dy = -b.dy; }

      // Paddle collision
      if (b.dy > 0 &&
          b.y + BALL_RADIUS >= PADDLE_Y &&
          b.y - BALL_RADIUS <= PADDLE_Y + PADDLE_HEIGHT &&
          b.x + BALL_RADIUS >= paddleX &&
          b.x - BALL_RADIUS <= paddleX + paddleWidth) {
        b.dy = -b.dy;
        zzfx(...[1.1,,404,.01,.01,.04,1,3.4,-1,,,,.01,,,,,.84,.02,.02,188]); // Blip 9
        const hitPos = (b.x - paddleX) / paddleWidth;
        const angle = (hitPos - 0.5) * 1.6;
        const speed = Math.hypot(b.dx, b.dy);
        b.dx = Math.sin(angle) * speed;
        b.dy = -Math.abs(Math.cos(angle)) * speed;
        b.y = PADDLE_Y - BALL_RADIUS - 0.5;

        if (isMain && activePowerUps.sticky > 0) {
          b.dx = 0; b.dy = 0;
          b.x = paddleX + paddleWidth / 2;
          b.y = PADDLE_Y - BALL_RADIUS - 1;
          ballStuck = true;
        }
      }

      ballBrickCollision(b);

      if (b.y - BALL_RADIUS > CH) return 'lost';
      return 'ok';
    }

    // ================= UPDATE =================
    function update() {
      updateParticles();

      if (levelCleared) {
        updatePowerUps();
        if (levelTransitionTimer > 0) levelTransitionTimer--;
        else advanceLevel();
        return;
      }
      if (gameOver || gameWin) {
        updatePowerUps();
        return;
      }

      // Power-up timers
      for (const k in activePowerUps) {
        if (activePowerUps[k] > 0) {
          activePowerUps[k]--;
          if (activePowerUps[k] === 0) {
            if (k === 'expand' || k === 'shrink') {
              const center = paddleX + paddleWidth / 2;
              paddleWidth = PADDLE_WIDTH;
              paddleX = Math.max(0, Math.min(CW - paddleWidth, center - paddleWidth / 2));
            }
            if (k === 'slow') {
              const norm = (vx, vy) => {
                const len = Math.hypot(vx, vy);
                if (len === 0) return [0, 0];
                return [vx / len * BALL_SPEED, vy / len * BALL_SPEED];
              };
              [ballDX, ballDY] = norm(ballDX, ballDY);
              for (const b of extraBalls) [b.dx, b.dy] = norm(b.dx, b.dy);
            }
          }
        }
      }

      // Paddle movement
      if (paddleTargetX !== null) {
        const desired = paddleTargetX - paddleWidth / 2;
        const clamped = Math.max(0, Math.min(CW - paddleWidth, desired));
        const diff = clamped - paddleX;
        if (Math.abs(diff) < 0.5) paddleX = clamped;
        else paddleX += diff * 0.45;
      } else {
        if (leftPressed) paddleX = Math.max(0, paddleX - PADDLE_SPEED);
        if (rightPressed) paddleX = Math.min(CW - paddleWidth, paddleX + PADDLE_SPEED);
      }

      updatePowerUps();

      // Ball on paddle
      if (!ballActive) {
        ballX = paddleX + paddleWidth / 2;
        ballY = PADDLE_Y - BALL_RADIUS - 1;
        ballDX = 0; ballDY = 0;
        return;
      }

      if (ballStuck) {
        ballX = paddleX + paddleWidth / 2;
        ballY = PADDLE_Y - BALL_RADIUS - 1;
        ballDX = 0; ballDY = 0;
        // extra balls still move
      } else {
        const main = { x: ballX, y: ballY, dx: ballDX, dy: ballDY };
        const res = stepBallState(main, true);
        ballX = main.x; ballY = main.y; ballDX = main.dx; ballDY = main.dy;

        if (res === 'lost') {
          if (extraBalls.length > 0) {
            const e = extraBalls.shift();
            ballX = e.x; ballY = e.y; ballDX = e.dx; ballDY = e.dy;
          } else {
            lives--;
            zzfx(...[,,312,.01,.1,.15,1,3.4,-10,,,,,1.6,,.4,,.98,.03]); // Hit 22
            updateUI();
            if (lives <= 0) {
              gameOver = true; ballActive = false;
              ballX = paddleX + paddleWidth / 2;
              ballY = PADDLE_Y - BALL_RADIUS - 1;
              ballDX = 0; ballDY = 0;
              extraBalls = []; powerUps = [];

            } else {
              resetBallAndPaddle();
            }
            return;
          }
        }
      }

      // Extra balls
      for (let i = extraBalls.length - 1; i >= 0; i--) {
        const e = extraBalls[i];
        const res = stepBallState(e, false);
        if (res === 'lost') extraBalls.splice(i, 1);
      }
    }

    // ================= DRAW =================
    function draw() {
      ctx.clearRect(0, 0, CW, CH);

      const grad = ctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#0a1020');
      grad.addColorStop(1, '#141e30');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CW, CH);

      ctx.fillStyle = '#ffffff08';
      for (let i = 0; i < CW; i += 40)
        for (let j = 0; j < CH; j += 40) {
          ctx.beginPath(); ctx.arc(i, j, 1.2, 0, Math.PI * 2); ctx.fill();
        }

      // bricks
      for (let r = 0; r < BRICK_ROWS; r++)
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;
          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);
          const hue = (r * 22 + levelIndex * 37 + 180) % 360;
          ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
          ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.roundRect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT, 6);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = `hsl(${hue}, 90%, 85%)`;
          ctx.beginPath();
          ctx.roundRect(brickX + 2, brickY + 2, BRICK_WIDTH - 4, BRICK_HEIGHT - 6, 4);
          ctx.fill();
        }
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

      // particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // power-ups
      for (const pu of powerUps) {
        ctx.shadowColor = pu.color;
        ctx.shadowBlur = 18;
        ctx.fillStyle = pu.color;
        ctx.beginPath();
        ctx.roundRect(pu.x - POWERUP_SIZE/2, pu.y - POWERUP_SIZE/2, POWERUP_SIZE, POWERUP_SIZE, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#00000099';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(pu.letter, pu.x, pu.y + 1);
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

      // paddle
      ctx.shadowColor = '#b0c8ff'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#b7d0ff';
      ctx.beginPath();
      ctx.roundRect(paddleX, PADDLE_Y, paddleWidth, PADDLE_HEIGHT, 12);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#e4eeff';
      ctx.beginPath();
      ctx.roundRect(paddleX + 4, PADDLE_Y + 2, paddleWidth - 8, 6, 6);
      ctx.fill();

      // extra balls
      for (const b of extraBalls) {
        ctx.shadowColor = '#fff9c4'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#fff9e6';
        ctx.beginPath(); ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffe066';
        ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, BALL_RADIUS - 2, 0, Math.PI * 2); ctx.fill();
      }

      // main ball
      ctx.shadowColor = '#fff9c4'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#fff9e6';
      ctx.beginPath(); ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(ballX - 2, ballY - 2, BALL_RADIUS - 2, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      drawActivePowerUps();

      // messages
      ctx.textAlign = 'center';
      if (levelCleared && levelTransitionTimer > 0) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#a8ffb0'; ctx.shadowColor = '#008822'; ctx.shadowBlur = 28;
        ctx.fillText('LEVEL CLEARED!', CW / 2, CH / 2 - 10);
        ctx.font = '22px monospace';
        ctx.fillStyle = '#ddffdd';
        ctx.fillText(`next: level ${((levelIndex + 1) % LEVELS.length) + 1}`, CW / 2, CH / 2 + 44);
        ctx.shadowBlur = 0;
      } else if (gameOver) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#ffb3b3'; ctx.shadowColor = '#aa0000'; ctx.shadowBlur = 24;
        ctx.fillText('GAME OVER', CW / 2, CH / 2 - 20);
        ctx.font = '22px monospace';
        ctx.fillStyle = '#ffdddd';
        ctx.fillText(`score ${score} · tap or press R to restart`, CW / 2, CH / 2 + 50);
        ctx.shadowBlur = 0;
      } else if (gameWin) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#f5e56b'; ctx.shadowColor = '#b8860b'; ctx.shadowBlur = 28;
        ctx.fillText('✨ ALL LEVELS ✨', CW / 2, CH / 2 - 20);
        ctx.font = '28px monospace';
        ctx.fillStyle = '#ffffcf';
        ctx.fillText('YOU WIN', CW / 2, CH / 2 + 28);
        ctx.font = '22px monospace';
        ctx.fillText('tap or press R to restart', CW / 2, CH / 2 + 70);
        ctx.shadowBlur = 0;
      } else if (!ballActive || ballStuck) {
        ctx.font = 'bold 22px "Segoe UI", monospace';
        ctx.fillStyle = '#b9d0ff'; ctx.shadowColor = '#3a5f9e'; ctx.shadowBlur = 12;
        ctx.fillText('tap or press SPACE to launch', CW / 2, CH - 100);
        ctx.shadowBlur = 0;
      }
      ctx.textAlign = 'left';
    }

    function drawActivePowerUps() {
      const items = [];
      if (activePowerUps.expand > 0) items.push({ color: '#4ade80', label: 'WIDE', t: activePowerUps.expand });
      if (activePowerUps.shrink > 0) items.push({ color: '#f87171', label: 'NARROW', t: activePowerUps.shrink });
      if (activePowerUps.slow > 0)   items.push({ color: '#a78bfa', label: 'SLOW', t: activePowerUps.slow });
      if (activePowerUps.sticky > 0) items.push({ color: '#f472b6', label: 'STICKY', t: activePowerUps.sticky });

      let y = 12;
      for (const it of items) {
        const secs = Math.ceil(it.t / 60);
        const text = `${it.label} ${secs}s`;
        ctx.font = 'bold 13px monospace';
        const w = ctx.measureText(text).width + 20;
        ctx.fillStyle = it.color + '33';
        ctx.strokeStyle = it.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(CW - w - 14, y, w, 24, 12);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = it.color;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, CW - w / 2 - 14, y + 12);
        y += 30;
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }

    // roundRect polyfill
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
      };
    }

    // ================= LOOP =================
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ================= INPUT HELPERS =================
    function clientToCanvas(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (CW / rect.width),
        y: (clientY - rect.top) * (CH / rect.height)
      };
    }

    function tryLaunchOrRestart() {
      if (gameOver || gameWin) { resetGame(); return; }
      if (!ballActive || ballStuck) launchBall();
    }

    // Touch
    canvas.addEventListener('touchstart', (e) => {
      startMusicOnce();
      if (e.touches.length > 1) return;
      e.preventDefault();
      const pt = clientToCanvas(e.touches[0].clientX, e.touches[0].clientY);
      touchActive = true; paddleTargetX = pt.x;
      touchStartX = pt.x; touchStartY = pt.y;
      touchStartTime = performance.now(); touchMoved = false;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!touchActive || e.touches.length > 1) return;
      e.preventDefault();
      const pt = clientToCanvas(e.touches[0].clientX, e.touches[0].clientY);
      if (Math.hypot(pt.x - touchStartX, pt.y - touchStartY) > TAP_MAX_DIST) touchMoved = true;
      paddleTargetX = pt.x;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (!touchActive) return;
      if (e.touches.length > 0) return;
      e.preventDefault();
      const dur = performance.now() - touchStartTime;
      const wasTap = !touchMoved && dur < TAP_MAX_TIME;
      touchActive = false; paddleTargetX = null;
      if (wasTap) tryLaunchOrRestart();
    }, { passive: false });

    canvas.addEventListener('touchcancel', () => {
      touchActive = false; paddleTargetX = null; touchMoved = false;
    }, { passive: false });

    // Mouse
    let mouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
      mouseDown = true;
      const pt = clientToCanvas(e.clientX, e.clientY);
      touchActive = true; paddleTargetX = pt.x;
      touchStartX = pt.x; touchStartY = pt.y;
      touchStartTime = performance.now(); touchMoved = false;
      startMusicOnce();
    });
    window.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
      const pt = clientToCanvas(e.clientX, e.clientY);
      if (Math.hypot(pt.x - touchStartX, pt.y - touchStartY) > TAP_MAX_DIST) touchMoved = true;
      paddleTargetX = pt.x;
    });
    window.addEventListener('mouseup', () => {
      if (!mouseDown) return;
      mouseDown = false;
      const dur = performance.now() - touchStartTime;
      const wasTap = !touchMoved && dur < TAP_MAX_TIME;
      touchActive = false; paddleTargetX = null;
      if (wasTap) tryLaunchOrRestart();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'Left' || k === 'a' || k === 'A') {
        leftPressed = true; paddleTargetX = null; touchActive = false; e.preventDefault();
      } else if (k === 'ArrowRight' || k === 'Right' || k === 'd' || k === 'D') {
        rightPressed = true; paddleTargetX = null; touchActive = false; e.preventDefault();
      } else if (k === ' ') {
        tryLaunchOrRestart(); e.preventDefault();
      } else if (k === 'r' || k === 'R') {
        resetGame(); e.preventDefault();
      }
      startMusicOnce();
    });
    document.addEventListener('keyup', (e) => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'Left' || k === 'a' || k === 'A') leftPressed = false;
      else if (k === 'ArrowRight' || k === 'Right' || k === 'd' || k === 'D') rightPressed = false;
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Space') e.preventDefault();
    }, { passive: false });

    document.getElementById('restartButton').addEventListener('click', resetGame);

// ================= BACKGROUND MUSIC =================
let audioCtx = null;
let musicBuffer = null;
let musicSource = null;
let musicStarted = false;
let musicMuted = localStorage.getItem('breakout_music_muted') === '1';

const musicToggleBtn = document.getElementById('musicToggle');

function updateMusicButton() {
  if (!musicToggleBtn) return;
  musicToggleBtn.textContent = musicMuted ? '🔇' : '🎵';
  musicToggleBtn.classList.toggle('muted', musicMuted);
}

// --- Load with OfflineAudioContext (no autoplay warning) ---
fetch('bckgdmus.mp3')
  .then(res => {
    if (!res.ok) throw new Error('music file not found: ' + res.status);
    return res.arrayBuffer();
  })
  .then(data => {
    const offline = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 44100);
    return offline.decodeAudioData(data);
  })
  .then(buffer => {
    musicBuffer = buffer;
    console.log('[music] buffer loaded, size:', buffer.duration.toFixed(1) + 's');
  })
  .catch(err => console.warn('[music] load failed:', err));

// --- Start music. Called ONLY from a real user gesture. ---
function startMusicOnce() {
  if (musicStarted) return;
  if (!musicBuffer) {
    console.log('[music] not ready yet, waiting for buffer...');
    return;
  }

  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      console.log('[music] audioCtx created, state:', audioCtx.state);
    }

    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    musicStarted = true;
    musicSource = audioCtx.createBufferSource();
    musicSource.buffer = musicBuffer;
    musicSource.loop = true;
    musicSource.connect(audioCtx.destination);
    musicSource.start();
    console.log('[music] playing, ctx state:', audioCtx.state);

    if (musicMuted) {
      setTimeout(() => {
        if (audioCtx.state === 'running') audioCtx.suspend();
      }, 50);
    }
  } catch (err) {
    console.warn('[music] start failed:', err);
  }
}

function toggleMusic() {
  musicMuted = !musicMuted;
  localStorage.setItem('breakout_music_muted', musicMuted ? '1' : '0');
  updateMusicButton();

  if (!audioCtx || !musicStarted) return;
  if (musicMuted) {
    if (audioCtx.state === 'running') audioCtx.suspend();
  } else {
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
}

if (musicToggleBtn) {
  musicToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMusic();
  });
}
updateMusicButton();

// ===== Gesture unlock — PC-friendly =====
// Every one of these fires reliably on desktop.
['click', 'mousedown', 'keydown', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
  document.addEventListener(evt, startMusicOnce, { passive: true });
});

    // ================= START =================
    resetGame();
    gameLoop();
  })();
</script>
</body>
