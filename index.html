<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BЯEAKOUT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    body {
      background: #0b0f1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, monospace;
      overflow: hidden;
    }
    .game-wrapper {
      background: #131a2c;
      padding: 1rem;
      border-radius: 2rem;
      box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #2e3b5e;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 800px;
      max-height: 70vh;
      aspect-ratio: 800 / 500;
      border-radius: 1.5rem;
      background: #0e1424;
      box-shadow: inset 0 0 40px #00000055, 0 8px 0 #05080f;
      touch-action: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b9c8ff;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 3px black;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .score, .lives, .level {
      background: #1d2742;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      box-shadow: inset 0 3px 6px #00000060, 0 4px 0 #0b0f1a;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .score span, .lives span, .level span {
      color: #f7f0b9;
      font-size: 1.2rem;
      font-weight: 800;
      min-width: 1.8rem;
      text-align: center;
      text-shadow: 0 0 12px #ffd966;
    }
    .restart-btn {
      background: #2a3759;
      border: none;
      color: #dee9ff;
      font-weight: bold;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      box-shadow: 0 5px 0 #0e121f, 0 6px 8px black;
      cursor: pointer;
      transition: 0.08s ease;
      text-transform: uppercase;
    }
    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0e121f, 0 4px 8px black;
    }
    .hint {
      color: #7b8bc0;
      font-size: 0.8rem;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="status-bar">
    <div class="score">🎯 <span id="scoreDisplay">0</span></div>
    <div class="lives">❤️ <span id="livesDisplay">3</span></div>
    <div class="level">📁 <span id="levelDisplay">1</span></div>
    <button class="restart-btn" id="restartButton">↻</button>
  </div>
  <div class="hint">drag to move · tap to launch · ⌨️ ← → / space · R restart</div>
</div>

<script>
  (function() {
    // ---------- CANVAS ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const livesSpan = document.getElementById('livesDisplay');
    const levelSpan = document.getElementById('levelDisplay');

    // ---------- DIMENSIONS ----------
    const CW = 800;
    const CH = 500;

    const PADDLE_WIDTH = 120;
    const PADDLE_HEIGHT = 16;
    const PADDLE_Y = CH - 40;
    const PADDLE_SPEED = 8;

    const BALL_RADIUS = 8;
    const BALL_SPEED = 5.5;

    const BRICK_COLS = 10;
    const BRICK_ROWS = 8;              // bumped up so patterns have room
    const BRICK_WIDTH = 68;
    const BRICK_HEIGHT = 22;
    const BRICK_PADDING = 6;
    const BRICK_OFFSET_X = (CW - (BRICK_COLS * (BRICK_WIDTH + BRICK_PADDING) - BRICK_PADDING)) / 2;
    const BRICK_OFFSET_Y = 50;

    // ---------- LEVEL DEFINITIONS ----------
    // Each level is an array of strings, one per row.
    // '#' = brick, '.' = empty. Rows are top-to-bottom.
    // Patterns are 10 wide. Height can be < BRICK_ROWS (extra rows are empty).
    const LEVELS = [
      // Level 1 — classic full wall
      [
        "##########",
        "##########",
        "##########",
        "##########",
        "##########"
      ],
      // Level 2 — pyramid
      [
        "....##....",
        "...####...",
        "..######..",
        ".########.",
        "##########"
      ],
      // Level 3 — checkerboard
      [
        "#.#.#.#.#.",
        ".#.#.#.#.#",
        "#.#.#.#.#.",
        ".#.#.#.#.#",
        "#.#.#.#.#."
      ],
      // Level 4 — diamond
      [
        "....##....",
        "...####...",
        "..######..",
        ".########.",
        "##########",
        ".########.",
        "..######..",
        "...####..."
      ],
      // Level 5 — two towers with bridge
      [
        "###....###",
        "###....###",
        "###....###",
        "##########",
        "###....###",
        "###....###",
        "###....###"
      ],
      // Level 6 — arrow pointing up
      [
        "....##....",
        "...####...",
        "..######..",
        ".########.",
        "##########",
        "....##....",
        "....##....",
        "....##...."
      ],
      // Level 7 — heart
      [
        ".###..###.",
        "##########",
        "##########",
        "##########",
        ".########.",
        "..######..",
        "...####...",
        "....##...."
      ],
      // Level 8 — zigzag / stairs
      [
        "##........",
        ".###......",
        "..#####...",
        "...#######",
        "....######",
        "...#######",
        "..#####...",
        ".###......"
      ],
      // Level 9 — columns (space invaders-ish)
      [
        "#.#.#.#.#.",
        "#.#.#.#.#.",
        "#.#.#.#.#.",
        "#.#.#.#.#.",
        "#.#.#.#.#.",
        ".#.#.#.#.#",
        "..#.#.#.#."
      ],
      // Level 10 — hollow box
      [
        "##########",
        "#........#",
        "#........#",
        "#........#",
        "#........#",
        "#........#",
        "#........#",
        "##########"
      ]
    ];

    // ---------- GAME STATE ----------
    let leftPressed = false;
    let rightPressed = false;

    let paddleX = (CW - PADDLE_WIDTH) / 2;
    let ballX = CW / 2;
    let ballY = PADDLE_Y - BALL_RADIUS - 1;
    let ballDX = 0;
    let ballDY = 0;
    let ballActive = false;

    let bricks = [];
    let score = 0;
    let lives = 3;
    let levelIndex = 0;                // 0-based, cycles through LEVELS
    let gameOver = false;
    let gameWin = false;               // "won the entire game" (all levels)
    let levelCleared = false;          // just cleared current level, showing transition

    // Touch state
    let paddleTargetX = null;
    let touchActive = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let touchMoved = false;
    const TAP_MAX_DIST = 12;
    const TAP_MAX_TIME = 250;

    // Level transition timer
    let levelTransitionTimer = 0;
    const LEVEL_TRANSITION_DURATION = 90; // frames (~1.5s at 60fps)

    // ---------- LEVEL LOADING ----------
    function loadLevel(index) {
      const pattern = LEVELS[index % LEVELS.length];
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        bricks[r] = [];
        const rowStr = r < pattern.length ? pattern[r] : "";
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks[r][c] = (rowStr[c] === '#') ? 1 : 0;
        }
      }
    }

    function resetBallAndPaddle() {
      paddleX = (CW - PADDLE_WIDTH) / 2;
      ballX = paddleX + PADDLE_WIDTH / 2;
      ballY = PADDLE_Y - BALL_RADIUS - 1;
      ballDX = 0;
      ballDY = 0;
      ballActive = false;
      paddleTargetX = null;
      touchActive = false;
    }

    // Start a brand new game (level 1)
    function resetGame() {
      score = 0;
      lives = 3;
      levelIndex = 0;
      gameOver = false;
      gameWin = false;
      levelCleared = false;
      levelTransitionTimer = 0;
      loadLevel(levelIndex);
      resetBallAndPaddle();
      updateUI();
    }

    // Advance to next level (keeping score/lives)
    function advanceLevel() {
      levelIndex++;
      if (levelIndex >= LEVELS.length) {
        // Looped back to start — you beat every level!
        gameWin = true;
        ballActive = false;
        return;
      }
      loadLevel(levelIndex);
      resetBallAndPaddle();
      levelCleared = false;
      levelTransitionTimer = 0;
      updateUI();
    }

    function updateUI() {
      scoreSpan.textContent = score;
      livesSpan.textContent = lives;
      levelSpan.textContent = (levelIndex % LEVELS.length) + 1;
    }

    // ---------- LAUNCH ----------
    function launchBall() {
      if (ballActive || gameOver || gameWin || levelCleared) return;
      ballActive = true;
      const angleUp = (Math.random() * 0.6 + 0.2) * Math.PI;
      ballDX = Math.cos(angleUp) * BALL_SPEED;
      ballDY = -Math.sin(angleUp) * BALL_SPEED;
      if (Math.abs(ballDY) < 1.8) {
        const sign = ballDY > 0 ? 1 : -1;
        ballDY = sign * 2.2;
        const len = Math.hypot(ballDX, ballDY);
        ballDX = (ballDX / len) * BALL_SPEED;
        ballDY = (ballDY / len) * BALL_SPEED;
      }
    }

    // ---------- BRICK COLLISION ----------
    function ballBrickCollision() {
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;

          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);

          const closestX = Math.max(brickX, Math.min(ballX, brickX + BRICK_WIDTH));
          const closestY = Math.max(brickY, Math.min(ballY, brickY + BRICK_HEIGHT));
          const dx = ballX - closestX;
          const dy = ballY - closestY;
          const distSq = dx * dx + dy * dy;

          if (distSq < BALL_RADIUS * BALL_RADIUS) {
            bricks[r][c] = 0;
            score += 10;
            updateUI();

            const oL = (ballX + BALL_RADIUS) - brickX;
            const oR = (brickX + BRICK_WIDTH) - (ballX - BALL_RADIUS);
            const oT = (ballY + BALL_RADIUS) - brickY;
            const oB = (brickY + BRICK_HEIGHT) - (ballY - BALL_RADIUS);
            const minX = Math.min(oL, oR);
            const minY = Math.min(oT, oB);

            if (minX < minY) {
              ballDX = -ballDX;
              if (oL < oR) ballX = brickX - BALL_RADIUS - 0.1;
              else ballX = brickX + BRICK_WIDTH + BALL_RADIUS + 0.1;
            } else {
              ballDY = -ballDY;
              if (oT < oB) ballY = brickY - BALL_RADIUS - 0.1;
              else ballY = brickY + BRICK_HEIGHT + BALL_RADIUS + 0.1;
            }

            // Check level cleared (any brick still alive?)
            const anyLeft = bricks.some(row => row.some(cell => cell === 1));
            if (!anyLeft) {
              levelCleared = true;
              ballActive = false;
              levelTransitionTimer = LEVEL_TRANSITION_DURATION;
            }
            return;
          }
        }
      }
    }

    // ---------- UPDATE ----------
    function update() {
      // level transition (after clearing a level)
      if (levelCleared) {
        if (levelTransitionTimer > 0) {
          levelTransitionTimer--;
        } else {
          advanceLevel();
        }
        return;
      }

      if (gameOver || gameWin) return;

      // Paddle movement
      if (paddleTargetX !== null) {
        const desired = paddleTargetX - PADDLE_WIDTH / 2;
        const clamped = Math.max(0, Math.min(CW - PADDLE_WIDTH, desired));
        const diff = clamped - paddleX;
        if (Math.abs(diff) < 0.5) paddleX = clamped;
        else paddleX += diff * 0.45;
      } else {
        if (leftPressed) paddleX = Math.max(0, paddleX - PADDLE_SPEED);
        if (rightPressed) paddleX = Math.min(CW - PADDLE_WIDTH, paddleX + PADDLE_SPEED);
      }

      if (!ballActive) {
        ballX = paddleX + PADDLE_WIDTH / 2;
        ballY = PADDLE_Y - BALL_RADIUS - 1;
        return;
      }

      ballX += ballDX;
      ballY += ballDY;

      if (ballX - BALL_RADIUS < 0) { ballX = BALL_RADIUS; ballDX = -ballDX; }
      else if (ballX + BALL_RADIUS > CW) { ballX = CW - BALL_RADIUS; ballDX = -ballDX; }
      if (ballY - BALL_RADIUS < 0) { ballY = BALL_RADIUS; ballDY = -ballDY; }

      if (ballDY > 0 &&
          ballY + BALL_RADIUS >= PADDLE_Y &&
          ballY - BALL_RADIUS <= PADDLE_Y + PADDLE_HEIGHT &&
          ballX + BALL_RADIUS >= paddleX &&
          ballX - BALL_RADIUS <= paddleX + PADDLE_WIDTH) {
        ballDY = -ballDY;
        const hitPos = (ballX - paddleX) / PADDLE_WIDTH;
        const angle = (hitPos - 0.5) * 1.6;
        const speed = Math.hypot(ballDX, ballDY);
        ballDX = Math.sin(angle) * speed;
        ballDY = -Math.abs(Math.cos(angle)) * speed;
        ballY = PADDLE_Y - BALL_RADIUS - 0.5;
      }

      ballBrickCollision();

      if (ballY - BALL_RADIUS > CH) {
        lives--;
        updateUI();
        if (lives <= 0) {
          gameOver = true;
          ballActive = false;
          ballX = paddleX + PADDLE_WIDTH / 2;
          ballY = PADDLE_Y - BALL_RADIUS - 1;
          ballDX = 0; ballDY = 0;
        } else {
          resetBallAndPaddle();
        }
      }
    }

    // ---------- DRAW ----------
    function draw() {
      ctx.clearRect(0, 0, CW, CH);

      const grad = ctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#0a1020');
      grad.addColorStop(1, '#141e30');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CW, CH);

      ctx.fillStyle = '#ffffff08';
      for (let i = 0; i < CW; i += 40) {
        for (let j = 0; j < CH; j += 40) {
          ctx.beginPath();
          ctx.arc(i, j, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // bricks
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (bricks[r][c] === 0) continue;
          const brickX = BRICK_OFFSET_X + c * (BRICK_WIDTH + BRICK_PADDING);
          const brickY = BRICK_OFFSET_Y + r * (BRICK_HEIGHT + BRICK_PADDING);
          const hue = (r * 22 + levelIndex * 37 + 180) % 360;
          ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
          ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.roundRect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT, 6);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = `hsl(${hue}, 90%, 85%)`;
          ctx.beginPath();
          ctx.roundRect(brickX + 2, brickY + 2, BRICK_WIDTH - 4, BRICK_HEIGHT - 6, 4);
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // paddle
      ctx.shadowColor = '#b0c8ff';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#b7d0ff';
      ctx.beginPath();
      ctx.roundRect(paddleX, PADDLE_Y, PADDLE_WIDTH, PADDLE_HEIGHT, 12);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#e4eeff';
      ctx.beginPath();
      ctx.roundRect(paddleX + 4, PADDLE_Y + 2, PADDLE_WIDTH - 8, 6, 6);
      ctx.fill();

      // ball
      ctx.shadowColor = '#fff9c4';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#fff9e6';
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(ballX - 2, ballY - 2, BALL_RADIUS - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // messages
      ctx.textAlign = 'center';
      if (levelCleared && levelTransitionTimer > 0) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#a8ffb0';
        ctx.shadowColor = '#008822';
        ctx.shadowBlur = 28;
        ctx.fillText('LEVEL CLEARED!', CW / 2, CH / 2 - 10);
        ctx.font = '22px monospace';
        ctx.fillStyle = '#ddffdd';
        ctx.fillText(`next: level ${((levelIndex + 1) % LEVELS.length) + 1}`, CW / 2, CH / 2 + 44);
        ctx.shadowBlur = 0;
      } else if (gameOver) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#ffb3b3';
        ctx.shadowColor = '#aa0000';
        ctx.shadowBlur = 24;
        ctx.fillText('GAME OVER', CW / 2, CH / 2 - 20);
        ctx.font = '22px monospace';
        ctx.fillStyle = '#ffdddd';
        ctx.fillText(`score ${score} · tap or press R to restart`, CW / 2, CH / 2 + 50);
        ctx.shadowBlur = 0;
      } else if (gameWin) {
        ctx.font = 'bold 44px "Segoe UI", monospace';
        ctx.fillStyle = '#f5e56b';
        ctx.shadowColor = '#b8860b';
        ctx.shadowBlur = 28;
        ctx.fillText('✨ ALL LEVELS ✨', CW / 2, CH / 2 - 20);
        ctx.font = '28px monospace';
        ctx.fillStyle = '#ffffcf';
        ctx.fillText('YOU WIN', CW / 2, CH / 2 + 28);
        ctx.font = '22px monospace';
        ctx.fillText('tap or press R to restart', CW / 2, CH / 2 + 70);
        ctx.shadowBlur = 0;
      } else if (!ballActive) {
        ctx.font = 'bold 22px "Segoe UI", monospace';
        ctx.fillStyle = '#b9d0ff';
        ctx.shadowColor = '#3a5f9e';
        ctx.shadowBlur = 12;
        ctx.fillText('tap or press SPACE to launch', CW / 2, CH - 100);
        ctx.shadowBlur = 0;
      }
      ctx.textAlign = 'left';
    }

    // ---------- ROUND RECT POLYFILL ----------
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
      };
    }

    // ---------- LOOP ----------
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ---------- COORDINATE HELPER ----------
    function clientToCanvas(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = CW / rect.width;
      const scaleY = CH / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // ---------- TOUCH ----------
    function onTouchStart(e) {
      if (e.touches.length > 1) return;
      e.preventDefault();
      const t = e.touches[0];
      const pt = clientToCanvas(t.clientX, t.clientY);
      touchActive = true;
      paddleTargetX = pt.x;
      touchStartX = pt.x; touchStartY = pt.y;
      touchStartTime = performance.now();
      touchMoved = false;
    }
    function onTouchMove(e) {
      if (!touchActive || e.touches.length > 1) return;
      e.preventDefault();
      const t = e.touches[0];
      const pt = clientToCanvas(t.clientX, t.clientY);
      if (Math.hypot(pt.x - touchStartX, pt.y - touchStartY) > TAP_MAX_DIST) touchMoved = true;
      paddleTargetX = pt.x;
    }
    function onTouchEnd(e) {
      if (!touchActive) return;
      if (e.touches.length > 0) return;
      e.preventDefault();
      const duration = performance.now() - touchStartTime;
      const wasTap = !touchMoved && duration < TAP_MAX_TIME;
      touchActive = false;
      paddleTargetX = null;
      if (wasTap) {
        if (gameOver || gameWin) fullRestart();
        else if (!ballActive && !levelCleared) launchBall();
      }
    }
    function onTouchCancel() {
      touchActive = false;
      paddleTargetX = null;
      touchMoved = false;
    }
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchCancel, { passive: false });

    // mouse (desktop convenience)
    let mouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
      mouseDown = true;
      const pt = clientToCanvas(e.clientX, e.clientY);
      touchActive = true;
      paddleTargetX = pt.x;
      touchStartX = pt.x; touchStartY = pt.y;
      touchStartTime = performance.now();
      touchMoved = false;
    });
    window.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
      const pt = clientToCanvas(e.clientX, e.clientY);
      if (Math.hypot(pt.x - touchStartX, pt.y - touchStartY) > TAP_MAX_DIST) touchMoved = true;
      paddleTargetX = pt.x;
    });
    window.addEventListener('mouseup', () => {
      if (!mouseDown) return;
      mouseDown = false;
      const duration = performance.now() - touchStartTime;
      const wasTap = !touchMoved && duration < TAP_MAX_TIME;
      touchActive = false;
      paddleTargetX = null;
      if (wasTap) {
        if (gameOver || gameWin) fullRestart();
        else if (!ballActive && !levelCleared) launchBall();
      }
    });

    // ---------- KEYBOARD ----------
    function handleKeyDown(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        leftPressed = true;
        paddleTargetX = null; touchActive = false;
        e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        rightPressed = true;
        paddleTargetX = null; touchActive = false;
        e.preventDefault();
      } else if (key === ' ') {
        if (!ballActive && !gameOver && !gameWin && !levelCleared) launchBall();
        e.preventDefault();
      } else if (key === 'r' || key === 'R') {
        fullRestart();
        e.preventDefault();
      }
    }
    function handleKeyUp(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        leftPressed = false; e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        rightPressed = false; e.preventDefault();
      } else if (key === ' ') {
        e.preventDefault();
      }
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    // ---------- RESTART ----------
    function fullRestart() {
      resetGame();
    }
    document.getElementById('restartButton').addEventListener('click', fullRestart);

    // ---------- START ----------
    resetGame();
    gameLoop();

  })();
</script>
</body>
</html>
